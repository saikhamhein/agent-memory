# Local testing: loopback only. Later use the server's LAN IP for LAN access.
listen = "127.0.0.1:8787"
database = "/var/lib/agent-memory/memory.sqlite3"

# install-user.py writes these tokens itself. For a manual deploy, make a secret with
# `openssl rand -hex 32`, put its `printf %s SECRET | sha256sum` here, and keep the secret in the client config.
# agent-session is for ordinary sessions (client.json); memory-maintainer only for the dream (maintainer.json).
[[tokens]]
name = "agent-session"
sha256 = "REPLACE_WITH_GENERATED_SHA256"
capabilities = ["recall", "observe"]

[[tokens]]
name = "memory-maintainer"
sha256 = "REPLACE_WITH_A_DIFFERENT_GENERATED_SHA256"
capabilities = ["recall", "observe", "review", "promote"]
